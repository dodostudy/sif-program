<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIF 건설재해 위험성평가 - 기인물조회</title>
  <script>if(localStorage.getItem('sif-theme')==='light'){document.documentElement.classList.replace('dark','light')}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 모바일 필터 최적화 */
    @media (max-width: 767px) {
      .filter-bar { flex-direction: column; gap: 0.5rem; }
      .filter-group { width: 100%; }
      .filter-group select, .ms-dropdown { width: 100%; min-width: 0; }
      .filter-group label { min-width: auto; }
      #btn-reset { width: 100%; }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div id="sidebar"></div>

  <main id="content" class="p-4 lg:p-6">
    <div id="page-header"></div>

    <!-- 필터 바 -->
    <div class="filter-bar mb-4">
      <div class="filter-group" id="cause-koen-wrap"></div>
      <div class="filter-group">
        <label>작업유형</label>
        <div id="ms-worktype"></div>
      </div>
      <div class="filter-group">
        <label>12대 기인물</label>
        <div class="flex items-center gap-2 bg-gray-800 rounded-lg px-3 py-2">
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="filter-12-toggle" class="sr-only peer">
            <div class="w-9 h-5 bg-gray-600 rounded-full peer peer-checked:bg-purple-600 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
          </label>
          <span class="text-xs text-gray-400" id="filter-12-label">전체</span>
        </div>
      </div>
      <div class="filter-group">
        <label>기인물</label>
        <div id="ms-cause"></div>
      </div>
      <button id="btn-reset" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-sm rounded-lg transition-colors">초기화</button>
    </div>
    <div id="keyword-search-wrap" class="mb-4"></div>

    <!-- 선택된 기인물 요약 -->
    <div id="cause-summary" class="mb-4 hidden">
      <div class="chart-container">
        <div class="flex flex-wrap items-center gap-4">
          <div>
            <p class="text-xs text-gray-500">선택 기인물</p>
            <p class="text-xl font-bold text-white" id="cause-name">-</p>
          </div>
          <div>
            <p class="text-xs text-gray-500">총 사고건수</p>
            <p class="text-xl font-bold text-red-400" id="cause-count">-</p>
          </div>
          <div>
            <p class="text-xs text-gray-500">전체 순위</p>
            <p class="text-xl font-bold text-amber-400" id="cause-rank">-</p>
          </div>
          <div id="cause-badge-12"></div>
        </div>
      </div>
    </div>

    <!-- 차트: 공종별 + 재해형태별 + 작업명별.
         기인물을 하나만 고르면 '재해형태별' 카드는 아래 시나리오 구역 맨 위로 옮겨 간다 —
         재해형태 분포를 보고 바로 그 갈래를 이어 보게 하려는 것이다. -->
    <div id="chart-row" class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
      <div class="chart-container">
        <h3 class="text-sm font-semibold text-gray-300 mb-3">공종별 사고건수</h3>
        <div style="height:300px"><canvas id="chart-by-construction"></canvas></div>
      </div>
      <div class="chart-container" id="card-by-disaster">
        <h3 class="text-sm font-semibold text-gray-300 mb-3" id="disaster-chart-title">재해형태별 건수</h3>
        <div style="height:300px" id="disaster-chart-box"><canvas id="chart-by-disaster"></canvas></div>
      </div>
      <div class="chart-container">
        <h3 class="text-sm font-semibold text-gray-300 mb-3">작업명별 사고건수</h3>
        <div style="height:300px"><canvas id="chart-by-work"></canvas></div>
      </div>
    </div>

    <!-- 재해 시나리오 — 기인물 하나를 골랐을 때만 -->
    <div id="scenario-wrap" class="chart-container mb-4 hidden">
      <div class="flex flex-wrap items-baseline justify-between gap-2 mb-1">
        <h3 class="text-sm font-semibold text-gray-300">재해 시나리오</h3>
        <div class="flex items-center gap-3">
          <span class="text-xs text-gray-500" id="scenario-meta"></span>
          <button type="button" id="btn-scenario-excel"
            class="text-xs text-emerald-400 hover:text-emerald-300 px-3 py-1 border border-emerald-700 hover:border-emerald-500 rounded transition-colors">
            📥 엑셀 다운로드</button>
        </div>
      </div>
      <p class="text-xs text-gray-500 mb-3" id="scenario-sub"></p>
      <!-- 재해형태별 차트가 여기로 옮겨 온다 -->
      <div id="scenario-chart-slot" class="mb-1"></div>
      <div id="scenario-body"></div>
    </div>

    <!-- 재해사례 목록 (풀폭) -->
    <div class="chart-container">
      <h3 class="text-sm font-semibold text-gray-300 mb-3">재해사례 및 감소대책</h3>
      <div id="data-table"></div>
    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/data-loader.js"></script>
  <script src="../js/filter-manager.js"></script>
  <script src="../js/chart-manager.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/analytics.js"></script>
  <script src="../js/scenarios.js"></script>
  <script src="../js/multi-select.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>

  <script>
    // WORK_TYPE_MAP은 js/utils.js에서 전역 선언됨

    const cm = new ChartManager();
    const fm = new FilterManager(['koen', '작업유형', '12대기인물', '기인물', 'keyword']);
    let isMilpeActive = false; // 밀폐 특수 필터 상태
    fm.setDownstream('작업유형', ['기인물']);
    fm.setDownstream('12대기인물', ['기인물']);

    let allData = [];
    let dropdownRef = {};
    let causeCountMap = {};

    // 멀티셀렉트 인스턴스
    const msWorkType = new MultiSelect({
      containerId: 'ms-worktype',
      placeholder: '전체',
      showCounts: true,
      onChange: (values) => {
        if (!values || values.length === 0) {
          isMilpeActive = false;
          fm.set('작업유형', null);
          return;
        }
        isMilpeActive = values.includes('밀폐');
        // 선택된 유형들의 기인물 합집합
        const allCauses = [];
        values.forEach(type => {
          if (type !== '밀폐' && WORK_TYPE_MAP[type]) {
            allCauses.push(...WORK_TYPE_MAP[type]);
          }
        });
        fm.set('작업유형', allCauses.length > 0 ? [...new Set(allCauses)] : null);
      }
    });

    const msCause = new MultiSelect({
      containerId: 'ms-cause',
      placeholder: '기인물 선택',
      showCounts: true,
      onChange: (values) => fm.set('기인물', values)
    });

    let keywordInput = null;
    let lastScenarioForms = null;      // 내려받기가 화면과 같은 것을 쓰도록 보관

    async function init() {
      renderPageHeader('기인물조회', '기인물 기준 역방향 조회 - 해당 기인물이 어떤 공정에서 위험한지 분석');

      allData = await DataLoader.loadDB();
      dropdownRef = await DataLoader.loadDropdownRef();
      await Scenarios.load();

      // 전체 건수 맵 구축
      allData.forEach(r => {
        const c = r['기인물'];
        if (c) causeCountMap[c] = (causeCountMap[c] || 0) + 1;
      });

      document.getElementById('btn-scenario-excel').addEventListener('click', downloadScenarios);

      // 발전소 공정 토글
      createKoenToggle('cause-koen-wrap', (val) => fm.set('koen', val));

      // 키워드 검색
      keywordInput = createKeywordSearch('keyword-search-wrap', (val) => fm.set('keyword', val));

      setupFilters();
      renderResults();
      applyDeepLinkParams();
    }

    // 위험지도 딥링크 수신: 기인물 스코프 적용
    function applyDeepLinkParams() {
      const q = new URLSearchParams(location.search);
      const cause = q.get('기인물');
      if (cause) msCause.setValues([cause]);
    }

    function setupFilters() {
      const allCauses = (dropdownRef['기인물목록'] || []);
      const milpeCount = allData.filter(r => r['재해형태'] === '산소결핍 질식').length;

      // 작업유형 멀티셀렉트 옵션
      const workTypeOptions = Object.keys(WORK_TYPE_MAP).map(type => {
        const causeList = WORK_TYPE_MAP[type];
        const count = causeList === null
          ? milpeCount
          : (causeList || []).reduce((sum, c) => sum + (causeCountMap[c] || 0), 0);
        return { value: type, label: type, count: count };
      });
      msWorkType.setOptions(workTypeOptions);

      // 초기 기인물 멀티셀렉트
      updateCauseDropdown();

      // 12대기인물 토글
      document.getElementById('filter-12-toggle').addEventListener('change', (e) => {
        document.getElementById('filter-12-label').textContent = e.target.checked ? '12대만' : '전체';
        fm.set('12대기인물', e.target.checked ? true : null);
      });

      // 작업유형 변경 시 기인물 갱신
      fm.subscribe('작업유형', () => {
        updateCauseDropdown();
        msCause.clear();
      });

      // 12대 기인물 선택 시 기인물 갱신
      fm.subscribe('12대기인물', () => {
        updateCauseDropdown();
        msCause.clear();
      });

      // KOEN 변경 시 기인물 갱신
      fm.subscribe('koen', () => {
        causeCountMap = {};
        const baseData = fm.get('koen') === true ? allData.filter(r => r.KOEN공정) : allData;
        baseData.forEach(r => { const c = r['기인물']; if (c) causeCountMap[c] = (causeCountMap[c] || 0) + 1; });
        updateCauseDropdown();
        msCause.clear();
      });

      // 초기화
      document.getElementById('btn-reset').addEventListener('click', () => {
        fm.reset();
        isMilpeActive = false;
        const toggle12 = document.getElementById('filter-12-toggle');
        if (toggle12) { toggle12.checked = false; document.getElementById('filter-12-label').textContent = '전체'; }
        const koenToggle = document.getElementById('cause-koen-wrap-toggle');
        if (koenToggle) { koenToggle.checked = false; document.getElementById('cause-koen-wrap-label').textContent = '전체'; }
        if (keywordInput) keywordInput.value = '';
        msWorkType.clear();
        msCause.clear();
        causeCountMap = {};
        allData.forEach(r => { const c = r['기인물']; if (c) causeCountMap[c] = (causeCountMap[c] || 0) + 1; });
        msWorkType.setOptions(workTypeOptions);
        updateCauseDropdown();
      });

      fm.onDataChange(() => renderResults());
    }

    function updateCauseDropdown() {
      const allCauses = dropdownRef['기인물목록'] || [];
      const is12List = dropdownRef['12대기인물'] || [];
      const workTypeVal = fm.get('작업유형');
      const is12Val = fm.get('12대기인물');

      let candidates = [...allCauses];

      if (isMilpeActive) {
        const milpeCauses = [...new Set(
          allData.filter(r => r['재해형태'] === '산소결핍 질식').map(r => r['기인물']).filter(Boolean)
        )];
        candidates = candidates.filter(c => milpeCauses.includes(c));
      } else if (workTypeVal && Array.isArray(workTypeVal)) {
        candidates = candidates.filter(c => workTypeVal.includes(c));
      }

      if (is12Val === true) {
        candidates = candidates.filter(c => is12List.includes(c));
      }

      const sorted = [...candidates].sort((a, b) => (causeCountMap[b] || 0) - (causeCountMap[a] || 0));
      msCause.setOptions(sorted.map(c => ({
        value: c,
        label: c,
        count: causeCountMap[c] || 0
      })));
    }

    function renderResults() {
      const filters = fm.getAll();
      let filtered = filterDB(allData, filters);

      if (isMilpeActive) {
        filtered = filtered.filter(r => r['재해형태'] === '산소결핍 질식');
      }

      renderCauseSummary(filtered, filters);
      renderScenarios(filtered, filters);
      renderByConstructionChart(filtered);
      renderByDisasterChart(filtered);
      renderByWorkChart(filtered);
      renderTable(filtered);
    }

    function renderCauseSummary(data, filters) {
      const summary = document.getElementById('cause-summary');
      const selectedCause = filters['기인물'];

      if (!selectedCause) {
        summary.classList.add('hidden');
        return;
      }
      summary.classList.remove('hidden');

      const causeList = Array.isArray(selectedCause) ? selectedCause : [selectedCause];

      if (causeList.length === 1) {
        const cause = causeList[0];
        const allAgg = aggregateBy(allData, '기인물');
        const sorted = topN(allAgg, 'count', allAgg.length);
        const rank = sorted.findIndex(a => a.key === cause) + 1;
        const is12 = (dropdownRef['12대기인물'] || []).includes(cause);

        document.getElementById('cause-name').textContent = cause;
        document.getElementById('cause-count').textContent = formatNumber(data.length) + '건';
        document.getElementById('cause-rank').textContent = rank ? `${rank}위 / ${sorted.length}개` : '-';
        // 프로파일 — 이 기인물이 한 가지 재해로 죽는지, 여러 갈래로 죽는지.
        // 분산형(굴착기 등)은 재해형태를 하나로 못 정하므로 화면에서 분포로 봐야 한다.
        const prof = causeProfile(allData)[cause];
        const master = causeMaster(allData).find(m => m.기인물 === cause);
        const TYPE_STYLE = {
          '단일형': 'background:#064E3B;color:#6EE7B7;border:1px solid #059669',
          '혼합형': 'background:#78350F;color:#FCD34D;border:1px solid #B45309',
          '분산형': 'background:#7F1D1D;color:#FCA5A5;border:1px solid #B91C1C',
        };
        const bits = [];
        if (is12) bits.push('<span class="badge-12">12대 기인물 (중점관리대상)</span>');
        if (prof) {
          bits.push(`<span style="${TYPE_STYLE[prof.type]};font-size:.7rem;font-weight:700;padding:.15rem .45rem;border-radius:.25rem"
            title="1위 재해형태 비중 ${prof.topPct.toFixed(1)}% — 80% 이상 단일형, 50~80% 혼합형, 미만 분산형">${prof.type}</span>`);
          bits.push(`<span class="text-xs text-gray-400">주 재해 <b class="text-gray-300">${prof.top}</b> ${prof.topPct.toFixed(0)}%</span>`);
        }
        if (master) {
          bits.push(`<span class="text-xs text-gray-400">최근 5년 <b class="text-gray-300">${formatNumber(master.recentN)}건</b></span>`);
          if (master.주요공종) bits.push(`<span class="text-xs text-gray-400">주요 공종 <b class="text-gray-300">${master.주요공종.replace(/^\d+\.\s*/, '')}</b></span>`);
        }
        document.getElementById('cause-badge-12').innerHTML =
          `<div class="flex flex-wrap items-center gap-2">${bits.join('')}</div>`;
      } else {
        document.getElementById('cause-name').textContent = `${causeList.length}개 기인물 선택`;
        document.getElementById('cause-count').textContent = formatNumber(data.length) + '건';
        document.getElementById('cause-rank').textContent = '-';
        document.getElementById('cause-badge-12').innerHTML = '';
      }
    }

    /**
     * 재해 시나리오 — 기인물을 하나만 골랐을 때 나온다.
     * 재해형태를 대분류로 두고 그 아래 시나리오를 건수 순으로 싣는다.
     * 건수는 화면에 걸린 필터를 반영하므로, 공정을 좁히면 해당 사례가 없는 시나리오는 빠진다.
     */
    function renderScenarios(data, filters) {
      const wrap = document.getElementById('scenario-wrap');
      const sel = filters['기인물'];
      const list = Array.isArray(sel) ? sel : (sel ? [sel] : []);

      if (list.length !== 1 || !Scenarios.has(list[0])) {
        wrap.classList.add('hidden');
        moveDisasterChart(false);
        return;
      }
      const cause = list[0];
      const forms = Scenarios.forCause(cause, data);
      if (!forms.length) {
        wrap.classList.add('hidden');
        moveDisasterChart(false);
        return;
      }
      wrap.classList.remove('hidden');
      moveDisasterChart(true);
      lastScenarioForms = forms;

      const nScen = forms.reduce((a, f) => a + f.시나리오.length, 0);
      const nCase = forms.reduce((a, f) => a + f.건수, 0);
      document.getElementById('scenario-meta').textContent =
        `${formatNumber(nCase)}건 · 시나리오 ${nScen}개`;
      document.getElementById('scenario-sub').textContent =
        `${cause} 사고가 나는 방식을 ${Scenarios.summary(forms)}로 나눴습니다. ` +
        '사례 원문을 읽고 정한 것이며, 감소대책이 달라지는 지점을 기준으로 갈랐습니다.';

      document.getElementById('scenario-body').innerHTML = forms.map(f => `
        <div class="scn-form">
          <b>${escapeHtml(f.재해형태)}</b>
          <span>${formatNumber(f.건수)}건 · 이 기인물의 ${f.비중}% · 시나리오 ${f.시나리오.length}개</span>
        </div>
        ${f.시나리오.map((s, i) => scenarioCard(s, i + 1)).join('')}
      `).join('');
    }

    /**
     * 재해형태별 차트를 시나리오 구역 맨 위로 옮긴다(또는 원래 행으로 되돌린다).
     * 분포를 본 뒤 그 갈래를 바로 이어 보게 하려는 것이다. 차트를 두 벌 그리지 않고 같은 요소를 옮겨 쓴다.
     * 옮기기 전에 차트를 파괴한다 — Chart.js 가 캔버스의 옛 부모를 붙들고 있어 그대로 떼면 오류가 난다.
     * 호출 직후 renderByDisasterChart() 가 새 자리에서 다시 그린다(renderResults 의 호출 순서).
     */
    function moveDisasterChart(intoScenario) {
      const card = document.getElementById('card-by-disaster');
      const slot = document.getElementById('scenario-chart-slot');
      const row = document.getElementById('chart-row');
      if (!card || !slot || !row) return;

      const inScenario = card.parentElement === slot;
      if (intoScenario === inScenario) return;

      cm.destroy('chart-by-disaster');

      if (intoScenario) {
        slot.appendChild(card);
        card.classList.remove('chart-container');        // 이미 카드 안이라 테두리가 겹친다
        card.classList.add('scn-chart');
        row.classList.replace('lg:grid-cols-3', 'lg:grid-cols-2');
        document.getElementById('disaster-chart-title').textContent = '재해형태별 건수 — 아래 시나리오의 대분류';
      } else {
        row.insertBefore(card, row.children[1] || null);
        card.classList.add('chart-container');
        card.classList.remove('scn-chart');
        row.classList.replace('lg:grid-cols-2', 'lg:grid-cols-3');
        document.getElementById('disaster-chart-title').textContent = '재해형태별 건수';
      }
    }

    function scenarioCard(s, rank) {
      const rep = s.대표;
      const work = s.주요작업.map(([w, n]) => `${escapeHtml(w)} <i>${n}건</i>`).join(' · ');
      const ms = s.핵심대책.map(([m, n]) => `<li>${escapeHtml(m)} <i>(${n}건)</i></li>`).join('');
      const rest = s.사례.filter(r => r['id'] !== rep['id']);
      const id = `scn-more-${rank}-${Math.random().toString(36).slice(2, 7)}`;
      return `
        <div class="scn">
          <div class="scn-head">
            <span class="scn-rank">${rank}</span>
            <span class="scn-name">${escapeHtml(s.이름)}</span>
            <span class="scn-cnt">${s.건수}건 · 이 재해형태의 ${s.재해형태내비중}%</span>
          </div>
          <div class="scn-bar"><i style="width:${s.재해형태내비중}%"></i></div>
          ${work ? `<div class="scn-lbl">주로 어떤 작업에서</div><div class="scn-work">${work}</div>` : ''}
          <div class="scn-lbl">대표사례 — 사례번호 ${rep['id']} · ${escapeHtml(String(rep['공종'] || '').replace(/^\d+\.\s*/, ''))} · ${rep['발생연도']}년</div>
          <div class="scn-case">${escapeHtml(rep['재해유발요인'])}</div>
          ${ms ? `<div class="scn-lbl">이 시나리오에서 가장 많이 제시된 대책</div><ul class="scn-ms">${ms}</ul>` : ''}
          ${rest.length ? `
            <button type="button" class="scn-more" onclick="toggleScnMore('${id}', this, ${rest.length})">
              나머지 사례 ${rest.length}건 보기</button>
            <ul class="scn-list hidden" id="${id}">
              ${rest.map(r => `<li>${r['id']} · ${escapeHtml(r['재해유발요인'])}</li>`).join('')}
            </ul>` : ''}
        </div>`;
    }

    /** 지금 화면에 보이는 시나리오를 표로 내려받는다. 필터가 걸려 있으면 그 기준 그대로다. */
    function downloadScenarios() {
      const sel = fm.getAll()['기인물'];
      const cause = Array.isArray(sel) ? sel[0] : sel;
      if (!cause || !lastScenarioForms) return;

      const rows = [];
      lastScenarioForms.forEach(f => {
        f.시나리오.forEach((s, i) => {
          const rep = s.대표;
          const ms = s.핵심대책.map(([m]) => m).concat(['', '', '']);
          rows.push({
            기인물: cause,
            재해형태: f.재해형태,
            '재해형태 건수': f.건수,
            순위: i + 1,
            '재해 시나리오': s.이름,
            건수: s.건수,
            '재해형태 내 비중(%)': s.재해형태내비중,
            '주요 작업': s.주요작업.map(([w, n]) => `${w}(${n})`).join(' · '),
            '대표사례 번호': rep['id'],
            '대표사례 공종': String(rep['공종'] || '').replace(/^\d+\.\s*/, ''),
            '대표사례 작업명': rep['작업명'],
            '대표사례 연도': rep['발생연도'],
            '대표사례 재해유발요인': rep['재해유발요인'],
            '핵심대책 1': ms[0], '핵심대책 2': ms[1], '핵심대책 3': ms[2],
            '사례번호 전체': s.사례.map(r => r['id']).join(' '),
          });
        });
      });
      const columns = Object.keys(rows[0]).map(k => ({ key: k, label: k }));
      downloadTableAsExcel(columns, rows, `재해시나리오_${cause.replace(/[\\/:*?"<>|]/g, '')}`);
    }

    function toggleScnMore(id, btn, n) {
      const el = document.getElementById(id);
      const open = el.classList.toggle('hidden');
      btn.textContent = open ? `나머지 사례 ${n}건 보기` : '나머지 사례 접기';
    }

    function renderByConstructionChart(data) {
      const agg = aggregateBy(data, '공종');
      // 공종은 고정 차원(현재 13개) — 개수를 박아두면 신규 공종이 조용히 잘린다
      const sorted = topN(agg, 'count', agg.length);

      cm.create('chart-by-construction', {
        type: 'bar',
        data: {
          labels: sorted.map(a => I18n.tCat('공종', a.key).replace(/^\d+(\.\d+)*\.?\s*/, '')),
          datasets: [{
            data: sorted.map(a => a.count),
            backgroundColor: sorted.map((_, i) => CHART_COLORS.getAlpha(CHART_COLORS.getColor(i), 0.7)),
            borderColor: sorted.map((_, i) => CHART_COLORS.getColor(i)),
            borderWidth: 1, borderRadius: 3,
            maxBarThickness: 44,      // 재해형태가 한둘뿐인 기인물(사다리 등)에서 막대가 지나치게 굵어진다 — 제한 없으면 90px 남짓
          }]
        },
        options: {
          indexAxis: 'y',
          plugins: {
            legend: { display: false },
            datalabels: barDatalabels(data.length),
          },
          scales: {
            x: { grid: { color: CHART_COLORS.grid } },
            y: { grid: { display: false }, ticks: { font: { size: 10 } } }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function renderByDisasterChart(data) {
      const agg = aggregateBy(data, '재해형태');
      const sorted = topN(agg, 'count', 10);

      // 막대 두께를 제한했으므로 막대가 적으면 빈 칸이 남는다 — 칸 높이를 막대 수에 맞춘다.
      const box = document.getElementById('disaster-chart-box');
      const inScenario = document.getElementById('card-by-disaster').parentElement.id === 'scenario-chart-slot';
      box.style.height = inScenario
        ? Math.max(170, Math.min(340, sorted.length * 46 + 66)) + 'px'
        : '300px';

      cm.create('chart-by-disaster', {
        type: 'bar',
        data: {
          labels: sorted.map(a => I18n.tCat('재해형태', a.key)),
          datasets: [{
            data: sorted.map(a => a.count),
            backgroundColor: sorted.map((_, i) => CHART_COLORS.getAlpha(CHART_COLORS.getColor(i), 0.7)),
            borderColor: sorted.map((_, i) => CHART_COLORS.getColor(i)),
            borderWidth: 1, borderRadius: 3,
            maxBarThickness: 44,      // 재해형태가 한둘뿐인 기인물(사다리 등)에서 막대가 지나치게 굵어진다 — 제한 없으면 90px 남짓
          }]
        },
        options: {
          indexAxis: 'y',
          plugins: {
            legend: { display: false },
            datalabels: barDatalabels(data.length),
          },
          scales: {
            x: { grid: { color: CHART_COLORS.grid } },
            y: { grid: { display: false }, ticks: { font: { size: 10 } } }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function renderByWorkChart(data) {
      const agg = aggregateBy(data, '작업명');
      const sorted = topN(agg, 'count', 10);

      cm.create('chart-by-work', {
        type: 'bar',
        data: {
          labels: sorted.map(a => I18n.tCat('작업명', a.key)),
          datasets: [{
            data: sorted.map(a => a.count),
            backgroundColor: sorted.map((_, i) => CHART_COLORS.getAlpha(CHART_COLORS.getColor(i), 0.7)),
            borderColor: sorted.map((_, i) => CHART_COLORS.getColor(i)),
            borderWidth: 1, borderRadius: 3,
            maxBarThickness: 44,      // 재해형태가 한둘뿐인 기인물(사다리 등)에서 막대가 지나치게 굵어진다 — 제한 없으면 90px 남짓
          }]
        },
        options: {
          indexAxis: 'y',
          plugins: {
            legend: { display: false },
            datalabels: barDatalabels(data.length),
          },
          scales: {
            x: { grid: { color: CHART_COLORS.grid } },
            y: { grid: { display: false }, ticks: { font: { size: 9 }, autoSkip: false } }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function renderTable(data) {
      const columns = [
        { key: 'id', label: 'No', width: 40 },
        { key: '공종', label: '공종', width: 80, wrap: true,
          format: (v) => v ? v.replace(/^\d+\.\s*/, '') : '-' },
        { key: '작업명', label: '작업명', width: 100, wrap: true },
        { key: '재해형태', label: '재해형태', width: 70 },
        { key: '재해개요', label: '재해개요', minWidth: 250, wrap: true,
          format: (v) => `<div class="text-xs text-gray-300">${v || '-'}</div>` },
        { key: '위험성감소대책', label: '감소대책', minWidth: 200, wrap: true,
          format: (v) => `<div class="text-xs text-gray-300">${v || '-'}</div>` },
      ];
      buildTable('data-table', columns, data, {
        pageSize: 10,
        filterColumns: ['공종', '작업명', '재해형태']
      });
    }

    init();
  </script>
</body>
</html>
